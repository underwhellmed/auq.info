
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f9">
<title>AUQ — Quick Links</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --bg: #f7f7f9;
  --surface: #fff;
  --border: #e7e7ec;
  --text: #282832;
  --muted: #858591;
  --accent: #7770f7;
  --accent-soft: #efeeff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button { font: inherit; }

.page {
  width: 100%;
  max-width: 560px;
  animation: appear .45s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 42px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.8px;
}

.brand-mark {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--accent);
  transform: rotate(45deg);
}

.eyebrow {
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 42px);
  line-height: 1.15;
  letter-spacing: -1.8px;
  font-weight: 650;
}

.description {
  margin: 12px 0 30px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.links {
  display: grid;
  gap: 11px;
}

.link {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px;
  text-align: left;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 15px;
  cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}

.link:hover {
  transform: translateY(-2px);
  border-color: #d7d4ff;
  box-shadow: 0 9px 25px rgba(35, 30, 75, .055);
}

.link:active { transform: scale(.99); }

.link-icon {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1px solid #eeeeF3;
  border-radius: 12px;
  background: #f8f8fb;
  color: #777782;
  transition: background .18s, color .18s;
}

.link:hover .link-icon {
  background: var(--accent-soft);
  color: var(--accent);
}

.link-copy { flex: 1; min-width: 0; }

.link-title {
  font-size: 13px;
  font-weight: 600;
}

.link-subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}

.link-arrow {
  flex-shrink: 0;
  color: #a2a2ad;
  transition: transform .18s, color .18s;
}

.link:hover .link-arrow {
  color: var(--accent);
  transform: translate(2px, -2px);
}

.footer {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 24px;
  color: #92929d;
  font-size: 11px;
}

.footer svg { color: #7770f7; }

/* Confirmation dialog */

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(28, 28, 40, .24);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
}

.backdrop.open {
  opacity: 1;
  visibility: visible;
}

.dialog {
  width: 100%;
  max-width: 390px;
  padding: 24px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 20px;
  background: white;
  box-shadow: 0 20px 70px rgba(30,30,50,.16);
  transform: translateY(8px) scale(.985);
  transition: transform .2s;
}

.backdrop.open .dialog { transform: translateY(0) scale(1); }

.dialog-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  margin-bottom: 18px;
  border-radius: 14px;
  color: var(--accent);
  background: var(--accent-soft);
}

.dialog h2 {
  margin: 0;
  font-size: 19px;
  letter-spacing: -.5px;
}

.dialog-description {
  margin: 9px 0 19px;
  color: #777783;
  font-size: 12px;
  line-height: 1.7;
}

.destination {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fafafd;
}

.destination-icon {
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: #777783;
}

.destination-copy { min-width: 0; }

.destination-title {
  font-size: 12px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.destination-url {
  margin-top: 5px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 22px;
}

.action {
  min-height: 38px;
  padding: 0 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: #666672;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s, transform .15s;
}

.action:hover { background: #f4f4f7; }
.action:active { transform: scale(.98); }

.action.primary {
  color: white;
  background: var(--accent);
  border-color: var(--accent);
}

.action.primary:hover { background: #625be8; }

button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<main class="page">
  <div class="brand">
    <span class="brand-mark"></span>
    AUQ
  </div>

  <div class="eyebrow">Quick access</div>
  <h1>Where to?</h1>
  <p class="description">Choose a destination to continue.</p>

  <div class="links">
    <button class="link" data-title="Example Site 1" data-url="https://example.com">
      <span class="link-icon"><i data-lucide="globe" width="19"></i></span>
      <span class="link-copy">
        <span class="link-title">Example Site 1</span>
        <span class="link-subtitle">example.com</span>
      </span>
      <i class="link-arrow" data-lucide="arrow-up-right" width="17"></i>
    </button>

    <button class="link" data-title="Example Site 2" data-url="https://example.org">
      <span class="link-icon"><i data-lucide="compass" width="19"></i></span>
      <span class="link-copy">
        <span class="link-title">Example Site 2</span>
        <span class="link-subtitle">example.org</span>
      </span>
      <i class="link-arrow" data-lucide="arrow-up-right" width="17"></i>
    </button>

    <button class="link" data-title="Example Site 3" data-url="https://example.net">
      <span class="link-icon"><i data-lucide="external-link" width="19"></i></span>
      <span class="link-copy">
        <span class="link-title">Example Site 3</span>
        <span class="link-subtitle">example.net</span>
      </span>
      <i class="link-arrow" data-lucide="arrow-up-right" width="17"></i>
    </button>
  </div>

  <div class="footer">
    <i data-lucide="shield-check" width="14"></i>
    External destinations require confirmation.
  </div>
</main>

<div class="backdrop" id="backdrop" role="presentation">
  <section class="dialog" role="dialog" aria-modal="true"
    aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
    <div class="dialog-icon">
      <i data-lucide="external-link" width="21"></i>
    </div>

    <h2 id="dialogTitle">Leaving AUQ</h2>
    <p class="dialog-description" id="dialogDescription">
      You're about to visit an external website. Would you like to continue?
    </p>

    <div class="destination">
      <span class="destination-icon"><i data-lucide="globe" width="18"></i></span>
      <span class="destination-copy">
        <span class="destination-title" id="destinationTitle"></span>
        <span class="destination-url" id="destinationUrl"></span>
      </span>
    </div>

    <div class="actions">
      <button class="action" id="cancel">Cancel</button>
      <button class="action primary" id="continue">
        Continue <i data-lucide="arrow-up-right" width="14"></i>
      </button>
    </div>
  </section>
</div>

<script>
lucide.createIcons();

const backdrop = document.getElementById("backdrop");
const destinationTitle = document.getElementById("destinationTitle");
const destinationUrl = document.getElementById("destinationUrl");
const continueButton = document.getElementById("continue");
const cancelButton = document.getElementById("cancel");

let pendingUrl = null;
let previousFocus = null;

document.querySelectorAll(".link").forEach(button => {
  button.addEventListener("click", () => {
    const title = button.dataset.title;
    const rawUrl = button.dataset.url;

    try {
      const url = new URL(rawUrl);

      if (!["https:", "http:"].includes(url.protocol)) return;

      pendingUrl = url.href;
      previousFocus = button;
      destinationTitle.textContent = title;
      destinationUrl.textContent = url.href;

      backdrop.classList.add("open");
      document.body.style.overflow = "hidden";
      continueButton.focus();
    } catch {
      pendingUrl = null;
    }
  });
});

function closeDialog() {
  backdrop.classList.remove("open");
  document.body.style.overflow = "";
  pendingUrl = null;
  if (previousFocus) previousFocus.focus();
}

cancelButton.addEventListener("click", closeDialog);

backdrop.addEventListener("click", event => {
  if (event.target === backdrop) closeDialog();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && backdrop.classList.contains("open")) {
    closeDialog();
  }
});

continueButton.addEventListener("click", () => {
  if (!pendingUrl) return;

  const url = pendingUrl;
  closeDialog();
  window.open(url, "_blank", "noopener,noreferrer");
});
</script>
</body>
</html>
